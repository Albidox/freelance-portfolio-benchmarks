server:
  port: 8086

spring:
  application:
    name: artifact-qa-d10
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/artifact_d10_db?currentSchema=d10_regression_sandbox
    username: postgres
    password: ""
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    schemas: d10_regression_sandbox
    default-schema: d10_regression_sandbox
    create-schemas: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
