spring.application.name=hibernate-n1-remediation
spring.datasource.url=jdbc:h2:mem:n1db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.ashfaq.n1.tracker.SqlStatementCountTracker
server.port=0
