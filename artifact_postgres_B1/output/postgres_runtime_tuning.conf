# ============================================================================
# Artifact B1: PostgreSQL Production Runtime Parameter Configuration
# Target: PostgreSQL 13+ / 16+ / 18 (AWS RDS gp3, NVMe, Cloud, Dedicated Linux)
# Hardware Profile Reference: 32 GB RAM, 8 vCPU, NVMe / AWS EBS gp3 Storage
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Memory Sizing & Query Workspace
# ----------------------------------------------------------------------------

# Sizing rule: 25% of total system RAM on dedicated database servers.
# Provides a shared cache for table and index pages without starving OS buffer cache.
# Reference (32 GB RAM): 8 GB
shared_buffers = 8GB

# Sizing rule: 75% of total system RAM.
# Informs the query planner of total memory available for disk caching (shared_buffers + OS cache).
# Does NOT allocate memory at startup.
# Reference (32 GB RAM): 24 GB
effective_cache_size = 24GB

# Sizing formula: (Total RAM - shared_buffers) / (max_connections * 3)
# For 32 GB RAM, shared_buffers = 8 GB, max_connections = 200:
# Remaining memory = 24 GB (24,576 MB)
# Estimated concurrent operations = 200 * 3 = 600
# work_mem = 24,576 MB / 600 ≈ 40 MB (conservative production default: 32 MB to 64 MB).
# Eliminates external merge sort and hash spills to disk while protecting against Linux OOM killer.
work_mem = 32MB

# Sizing rule: 5% to 10% of total system RAM, capped at 2 GB.
# Used by maintenance operations: VACUUM, CREATE INDEX, ALTER TABLE ADD FOREIGN KEY.
maintenance_work_mem = 2GB

# Sizing rule: 16 MB or 1/32 of shared_buffers (capped at 16 MB to 64 MB).
wal_buffers = 16MB

# ----------------------------------------------------------------------------
# 2. Planner Cost & Storage Profile (NVMe / High-Performance SSD / AWS gp3)
# ----------------------------------------------------------------------------

# Sequential page fetch cost baseline (standard reference: 1.0).
seq_page_cost = 1.0

# Sizing rule: 1.1 for NVMe SSD / AWS gp3 (default 4.0 is obsolete 7,200 RPM spinning disk).
# Corrects the planner bias that prematurely favors sequential scans over index lookups.
random_page_cost = 1.1

# Sizing rule: 200 for SSD / NVMe storage (default 1 is for spinning disks).
# Controls asynchronous prefetch depth for bitmap index scans.
effective_io_concurrency = 200

# ----------------------------------------------------------------------------
# 3. Checkpoint & Write-Ahead Log (WAL) Tuning
# ----------------------------------------------------------------------------

# Spreads checkpoint writes over 90% of the checkpoint interval to smooth out I/O spikes.
checkpoint_completion_target = 0.9

# Checkpoint frequency: 15 minutes reduces write amplification during steady workloads.
checkpoint_timeout = 15min

# WAL retention limits: prevents premature checkpoints under heavy write throughput.
min_wal_size = 2GB
max_wal_size = 16GB

# ----------------------------------------------------------------------------
# 4. Asynchronous & Parallel Query Optimization
# ----------------------------------------------------------------------------

# Maximum background workers across the cluster.
max_worker_processes = 8

# Maximum parallel workers available for concurrent query execution.
max_parallel_workers = 8

# Maximum parallel workers assigned to a single query execution node.
# Prevents single analytical queries from monopolizing all CPU cores.
max_parallel_workers_per_gather = 2

# ----------------------------------------------------------------------------
# 5. Non-Invasive Observability & Logging Audit Configuration
# ----------------------------------------------------------------------------

# Logs queries exceeding 250 milliseconds.
log_min_duration_statement = 250

# Logs all checkpoint events, write durations, and buffer sync stats.
log_checkpoints = on

# Logs queries waiting longer than deadlock_timeout for lock acquisition.
log_lock_waits = on

# Logs all temporary file spills to disk (0 = log all spills with byte size).
log_temp_files = 0

# Logs autovacuum operations executing longer than 250 milliseconds.
log_autovacuum_min_duration = 250

# Format prefix compatible with pgBadger log parsing and reporting.
log_line_prefix = '%m [%p] %q%u@%d '

# ----------------------------------------------------------------------------
# 6. Lock Protection & Query Guardrails
# ----------------------------------------------------------------------------

# Aborts lock acquisition attempts exceeding 5 seconds to prevent transaction queue cascades.
lock_timeout = 5s

# Aborts individual query execution exceeding 30 seconds for OLTP endpoints.
# Set to 0 in dedicated analytical or migration sessions.
statement_timeout = 30s
